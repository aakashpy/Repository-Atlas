<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Repository Atlas</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <div class="chat-col">
      <header>
        <h1>Repository Atlas</h1>
        <span>ask questions about this repo's code, history, and workflows</span>
      </header>
      <div id="messages"></div>
      <form id="input-form">
        <div id="input-row">
          <textarea id="question" rows="1" placeholder="Ask a question about the repo…" autofocus></textarea>
          <button id="send-btn" type="submit">Send</button>
        </div>
      </form>
    </div>
    <div class="retrieval-col">
      <header>
        <h1>Retrieval</h1>
        <span>what was fetched &amp; sent to the LLM</span>
      </header>
      <div id="retrieval-body"></div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
